# Independently buildable, including when checked out as a submodule.
[workspace]
members = ["network", "tx-pool", "alignment", "execution", "storage"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
publish = false
repository = "https://github.com/djm07073/baton"

[workspace.dependencies]
baton-alignment = { path = "alignment" }
baton-tx-pool = { path = "tx-pool" }
baton-execution = { path = "execution" }
baton-storage = { path = "storage" }
bytes = "1.12.1"
thiserror = "2"
commonware-actor = { git = "https://github.com/0xEyrie/monorepo", rev = "6233438985d8249d2b2bc1204191d5d405652288" }
commonware-codec = { git = "https://github.com/0xEyrie/monorepo", rev = "6233438985d8249d2b2bc1204191d5d405652288" }
commonware-consensus = { git = "https://github.com/0xEyrie/monorepo", rev = "6233438985d8249d2b2bc1204191d5d405652288" }
commonware-cryptography = { git = "https://github.com/0xEyrie/monorepo", rev = "6233438985d8249d2b2bc1204191d5d405652288" }
commonware-macros = { git = "https://github.com/0xEyrie/monorepo", rev = "6233438985d8249d2b2bc1204191d5d405652288" }
commonware-utils = { git = "https://github.com/0xEyrie/monorepo", rev = "6233438985d8249d2b2bc1204191d5d405652288" }


# Shared Commonware rules; every Baton member must opt in with [lints] workspace = true.
[workspace.lints.rust]
# Unconnected fields and private methods are intentional implementation assignments.
dead_code = "allow"
unsafe_code = "forbid"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(full_bench)', 'cfg(huge_bench)', 'cfg(benchmark_tracking)', 'cfg(generate_conformance_tests)', 'cfg(commonware_stability_BETA)', 'cfg(commonware_stability_GAMMA)', 'cfg(commonware_stability_DELTA)', 'cfg(commonware_stability_EPSILON)', 'cfg(commonware_stability_RESERVED)'] }
unused-must-use = "deny"
rust-2018-idioms = "deny"
warnings = "deny"

[workspace.lints.clippy]
missing-const-for-fn = "warn"
use-self = "warn"
redundant-clone = "warn"
option-if-let-else = "warn"
disallowed_types = "deny"
disallowed_macros = "deny"
disallowed_methods = "deny"
undocumented_unsafe_blocks = "deny"
multiple_inherent_impl = "deny"
unused-async = "warn"
large_futures = "warn"
# Match Commonware's exception for false positives on assignment operators.
suspicious_op_assign_impl = "allow"

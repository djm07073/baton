[package]
name = "qmdb-revm"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
authors = ["Andreas Bigger <andreas@nascent.xyz>"]
license = "MIT"
description = "QMDB-backed REVM state database"
homepage = "https://github.com/andreasbigger/qmdb-revm"
repository = "https://github.com/andreasbigger/qmdb-revm"
keywords = ["revm", "qmdb", "ethereum", "evm"]
categories = ["cryptography::cryptocurrencies"]

[features]
default = []

[dependencies]
alloy-primitives = { version = "1", default-features = false, features = ["std"] }
revm = { version = "24", default-features = false, features = ["std", "asyncdb"] }
commonware-storage = { version = "0.0.65", default-features = false, features = ["std"] }
thiserror = "2"
tokio = { version = "1", features = ["sync", "rt"] }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
tokio = { version = "1", features = ["sync", "rt", "macros", "rt-multi-thread"] }

[[bench]]
name = "qmdb_revm"
harness = false

[lints.rust]
missing-debug-implementations = "warn"
missing_docs = "warn"
rust-2018-idioms = "deny"
unreachable-pub = "warn"
unnameable-types = "warn"
unused-must-use = "deny"

[lints.rustdoc]
all = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
missing-const-for-fn = "warn"
option-if-let-else = "warn"
redundant-clone = "warn"
use-self = "warn"

[profile.dev]
debug = "line-tables-only"
incremental = false
split-debuginfo = "packed"

[profile.release]
codegen-units = 16
lto = "thin"
opt-level = 3
panic = "unwind"
strip = "symbols"

[profile.maxperf]
inherits = "release"
codegen-units = 1
lto = "fat"
